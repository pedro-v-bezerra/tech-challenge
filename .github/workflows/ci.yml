name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    env:
      # `prisma generate` (no build/typecheck) valida que a URL existe — não conecta ao banco.
      # Um valor dummy basta enquanto não há testes de banco (Postgres real entra na Fase 3).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/challenge?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm quality
