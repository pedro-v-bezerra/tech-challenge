packages:
  - 'apps/*'
  - 'packages/*'

# Dependências autorizadas a rodar build scripts (pnpm bloqueia por padrão, por segurança).
# Prisma precisa posicionar o query engine; esbuild é usado pelo tsx (seed).
# @parcel/watcher e unrs-resolver são acelerações nativas opcionais (watch/resolver) — não
# precisamos delas no quality gate, então ficam desabilitadas (fallback em JS).
# @scarf/scarf é telemetria (beacon no postinstall) — desabilitado por privacidade.
# sharp é otimização de imagem opcional do Next — não precisamos do binário nativo.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
